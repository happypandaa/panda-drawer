[package]
name = "platform-update-handoff"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
test-process-fixture = ["dep:tokio"]

[target.'cfg(target_os = "macos")'.dependencies]
platform-update-witness = { path = "../platform-update-witness" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }

[target.'cfg(windows)'.dependencies]
platform-native = { path = "../platform-native" }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_System_Pipes", "Win32_System_Threading", "Wdk_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "update-handoff-test-fixture"
path = "tests/fixtures/handoff.rs"
required-features = ["test-process-fixture"]
test = false
