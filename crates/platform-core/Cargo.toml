[package]
name = "platform-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
production-profile = []
production-resource-anchors = ["production-profile"]

[build-dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
platform-native = { path = "../platform-native" }
anyhow = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
dirs = "6"
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled", "hooks", "limits", "backup"] }
base64 = "0.22"
png = "0.18"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
schemars = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
