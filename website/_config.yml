title: 熊猫小抽屉
subtitle: 现成的小应用，用你自己的 AI 改成你想要的样子。
description: 熊猫小抽屉是管理本机小应用的桌面软件。打开推荐应用直接用，也可以交给你自己的 AI 工具修改。
author: 熊猫小抽屉
language: zh-CN
timezone: Asia/Shanghai
url: https://panda-app-drawer.ethan8899.chatgpt.site
root: /
permalink: tutorials/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: dist
tag_dir: tags
archive_dir: tutorials
category_dir: categories
code_dir: downloads/code
skip_render:
  - robots.txt
  - llms.txt
ignore:
  - '**/css/rtl.styl'
new_post_name: :title.md
default_layout: post
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  enable: false
index_generator:
  path: ''
  per_page: 10
  order_by: -date
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page
theme: cactus
theme_config:
  colorscheme: dark
  page_width: 48
  projects_url: /apps/
  nav:
    home: /
    projects: /apps/
    articles: /tutorials/
    wiki: /wiki/
    download: /download/
  logo:
    enabled: true
    width: 50
    height: 50
    url: /images/panda.png
    gravatar: false
    grayout: false
  favicon:
    desktop:
      url: /images/panda.png
      gravatar: false
    android: false
    apple: false
  copyright:
    start_year: 2026
  posts_overview:
    show_all_posts: false
    post_count: 5
    sort_updated: false
  post:
    show_updated: true
  cdn:
    enable: false
  error_404:
    enabled: true
    title: 没找到这个页面
    description: 页面可能已移动。可以从首页、帮助或教程重新开始。
