title: 熊猫小抽屉
subtitle: 现成的小应用，用你自己的 AI 改成你想要的样子。
description: |
  挑一个现成的小应用用起来，哪里不顺手，就告诉自己的 AI 工具，改成你想要的样子。熊猫小抽屉不自带 AI，应用和数据都在你自己的电脑上。

  **选一个应用 → 用起来 → 想改哪里，交给你的 AI。**

  看看 [应用](/apps/)，或从 [入门指南](/wiki/getting-started/) 开始。让你的 AI 先读 [平台规则](/wiki/platform-rules/)。

  当前为内部开发版，还没有公开安装包；macOS（Apple Silicon）优先，Windows 正在适配。
author: 熊猫小抽屉
language: zh-CN
timezone: Asia/Shanghai
url: https://panda-app-drawer.ethan8899.chatgpt.site
root: /
permalink: tutorials/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: dist
tag_dir: tags
archive_dir: tutorials
category_dir: categories
code_dir: downloads/code
skip_render:
  - robots.txt
  - llms.txt
ignore:
  - '**/css/rtl.styl'
new_post_name: :title.md
default_layout: post
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  enable: false
index_generator:
  path: ''
  per_page: 10
  order_by: -date
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page
theme: cactus
theme_config:
  colorscheme: dark
  page_width: 48
  projects_url: /apps/
  nav:
    home: /
    wiki: /wiki/
    articles: /tutorials/
    projects: /apps/
  social_links:
    - icon: github
      label: 在 GitHub 了解熊猫小抽屉
      link: https://github.com/happypandaa/panda-drawer
  logo:
    enabled: true
    width: 50
    height: 50
    url: /images/panda.png
    gravatar: false
    grayout: false
  favicon:
    desktop:
      url: /images/panda.png
      gravatar: false
    android: false
    apple: false
  copyright:
    start_year: 2026
  posts_overview:
    show_all_posts: false
    post_count: 5
    sort_updated: false
  post:
    show_updated: true
  cdn:
    enable: false
  error_404:
    enabled: true
    title: 没找到这个页面
    description: 页面可能已移动。可以从首页、Wiki 或教程重新开始。
