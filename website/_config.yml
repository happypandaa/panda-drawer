title: 熊猫小抽屉
subtitle: 给自己的小应用，一个家。
description: |
  拿来就用，想改就让你的 AI 改。

  从现成应用开始，或做一个自己的小工具。哪里不顺手，就交给你自己的 AI，慢慢改成喜欢的样子。

  熊猫小抽屉把应用和数据放在本机，负责打开、配置和管理；制作与修改使用你自己的 AI 工具。支持从 Git 链接、本机文件夹添加，也可以从零开始。

  先看 [应用列表](/apps/)，或读 [入门指南](/wiki/getting-started/)。当前为内部开发版，尚无公开正式安装包；Windows x64 适配与验收中。
