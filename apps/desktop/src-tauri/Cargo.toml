[package]
name = "platform-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "local-projects-desktop-dev"

[[bin]]
name = "local-projects-desktop-dev"
path = "src/main.rs"

[[bin]]
name = "native-store-fixture"
path = "src/bin/native_store_fixture.rs"
required-features = ["native-store-fixture"]

[features]
default = []
production-profile = ["platform-core/production-profile"]
production-resource-anchors = ["production-profile", "platform-core/production-resource-anchors"]
local-update-test = ["platform-core/local-update-test"]
native-store-fixture = ["tauri/test", "objc2-foundation/NSBundle", "objc2-foundation/NSUUID"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
platform-core = { path = "../../../crates/platform-core" }
platform-native = { path = "../../../crates/platform-native" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
minisign-verify = "0.3"
semver = "1"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
unicode-normalization = "0.1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
platform-update-handoff = { path = "../../../crates/platform-update-handoff" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDate", "NSSet", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebsiteDataStore", "WKWebsiteDataRecord", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSWindow", "NSTextField", "NSControl", "NSView", "NSButton", "NSButtonCell", "NSCell", "NSImage", "NSLayoutConstraint", "NSRunningApplication", "NSTitlebarAccessoryViewController", "NSViewController", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

