[package]
name = "platform-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "local-projects-desktop-dev"

[[bin]]
name = "local-projects-desktop-dev"
path = "src/main.rs"

[[bin]]
name = "native-store-fixture"
path = "src/bin/native_store_fixture.rs"
required-features = ["native-store-fixture"]

[features]
default = []
production-profile = ["platform-core/production-profile"]
production-resource-anchors = ["production-profile", "platform-core/production-resource-anchors"]
native-store-fixture = ["tauri/test", "objc2-foundation/NSBundle", "objc2-foundation/NSUUID"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
platform-core = { path = "../../../crates/platform-core" }
platform-native = { path = "../../../crates/platform-native" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
platform-update-handoff = { path = "../../../crates/platform-update-handoff" }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSSet", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebsiteDataStore", "WKWebsiteDataRecord", "block2"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_System_Com"] }

