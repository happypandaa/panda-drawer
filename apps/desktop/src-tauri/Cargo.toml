[package]
name = "platform-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "local-projects-desktop-dev"

[[bin]]
name = "local-projects-desktop-dev"
path = "src/main.rs"

[features]
default = []
production-profile = ["platform-core/production-profile"]
production-resource-anchors = ["production-profile", "platform-core/production-resource-anchors"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
platform-core = { path = "../../../crates/platform-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
platform-update-handoff = { path = "../../../crates/platform-update-handoff" }

[dev-dependencies]
tempfile = "3"

