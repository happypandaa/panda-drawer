[package]
name = "platform-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "local-projects-desktop-dev"

[[bin]]
name = "local-projects-desktop-dev"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
platform-node = { path = "../../../crates/platform-node" }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
platform-core = { path = "../../../crates/platform-core" }
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Foundation", "Win32_UI_Shell"]

[target.'cfg(target_os = "windows")'.dependencies]
platform-host = { path = "../../../crates/platform-host" }
platform-project-format = { path = "../../../crates/platform-project-format" }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"

